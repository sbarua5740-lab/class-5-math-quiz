const quiz = document.getElementById("quiz");
let currentSection="";
qs.forEach((q,i)=>{
  if(q[0]!==currentSection){
    currentSection=q[0];
    const s=document.createElement("div");
    s.className="section";
    s.textContent=(q[0]==="গুণিতক ও গুণনীয়ক"?"অধ্যায় ১: ":"অধ্যায় "+(q[0]==="দশমিক ভগ্নাংশ"?"২: ":q[0]==="শতকরা"?"৩: ":"৪: ")) + q[0];
    quiz.appendChild(s);
  }
  const div=document.createElement("div");
  div.className="q";
  div.dataset.index=i;
  let opts="";
  q[2].forEach((o,j)=>{
    opts+=`<label id="l-${i}-${j}"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(2453+j)}. ${o}</label>`;
  });
  div.innerHTML=`<h3>${i+1}. ${q[1]}</h3>${opts}<div class="feedback" id="f${i}"></div>`;
  quiz.appendChild(div);
});

document.getElementById("submit").onclick=()=>{
  let score=0, answered=0;
  qs.forEach((q,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    const feedback=document.getElementById("f"+i);
    q[2].forEach((_,j)=>document.getElementById(`l-${i}-${j}`).classList.remove("correct","wrong"));
    if(selected){
      answered++;
      const val=Number(selected.value);
      if(val===q[3]){
        score++;
        document.getElementById(`l-${i}-${val}`).classList.add("correct");
        feedback.innerHTML="✓ সঠিক উত্তর!";
      }else{
        document.getElementById(`l-${i}-${val}`).classList.add("wrong");
        document.getElementById(`l-${i}-${q[3]}`).classList.add("correct");
        feedback.innerHTML=`✗ ভুল উত্তর। <span class="answer">শুদ্ধ উত্তর: <b>${q[2][q[3]]}</b></span>`;
      }
    }else{
      document.getElementById(`l-${i}-${q[3]}`).classList.add("correct");
      feedback.innerHTML=`⚠ উত্তর দেওয়া হয়নি। <span class="answer">শুদ্ধ উত্তর: <b>${q[2][q[3]]}</b></span>`;
    }
  });
  const pct=(score/qs.length*100).toFixed(0);
  const result=document.getElementById("result");
  result.style.display="block";
  result.innerHTML=`<div>তোমার ফলাফল</div><div class="score">${score} / ${qs.length}</div><div>${pct}% সঠিক • ${answered}টি উত্তর দিয়েছ</div>`;
  document.getElementById("submit").style.display="none";
  document.getElementById("reset").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
};
