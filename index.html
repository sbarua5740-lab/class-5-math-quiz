const quiz=document.getElementById('quiz');
let done=0, answered=new Set();
questions.forEach((item,i)=>{
 const card=document.createElement('div'); card.className='card';
 card.innerHTML=`<h3>${i+1}. ${item.q}</h3>`;
 item.options.forEach((op,j)=>{
   const label=document.createElement('label'); label.className='opt';
   label.innerHTML=`<input type="radio" name="q${i}" value="${j}"> ${op}`;
   label.querySelector('input').addEventListener('change',()=>{
     if(answered.has(i)) return;
     answered.add(i); done++; document.getElementById('done').textContent=done;
     const fb=document.createElement('div'); fb.className='feedback';
     if(j===item.answer){
       label.classList.add('correct'); fb.textContent='✓ সঠিক উত্তর!';
     }else{
       label.classList.add('wrong');
       fb.textContent='✗ ভুল। শুদ্ধ উত্তর: '+item.options[item.answer];
       Array.from(card.querySelectorAll('.opt'))[item.answer].classList.add('correct');
     }
     card.appendChild(fb);
     card.querySelectorAll('input').forEach(x=>x.disabled=true);
   });
   card.appendChild(label);
 });
 quiz.appendChild(card);
});
